<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarCraft II Replay Analyzer</title>
</head>
<body>
    <h1>Upload a Replay File</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="replay_file" accept=".SC2Replay"><br><br>
        <input type="checkbox" id="analyze_option" name="analyze_option" value="true" checked>
        <label for="analyze_option">Perform Analysis</label><br>
        <input type="checkbox" id="visualize_option" name="visualize_option" value="true" checked>
        <label for="visualize_option">Generate Visualizations</label><br><br>
        <button type="submit">Upload and Process</button>
    </form>
</body>
</html>
