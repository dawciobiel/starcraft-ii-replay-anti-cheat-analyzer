<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Results</title>
</head>
<body>
    <h1>Analysis for {{ replay_name }}</h1>
    
    <h2>Alerts</h2>
    {% if alerts %}
        <pre>{{ alerts }}</pre>
    {% else %}
        <p>No alerts generated.</p>
    {% endif %}

    <a href="/">Analyze another replay</a>
</body>
</html>
